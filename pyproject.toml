[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koi-pov-mcp"
version = "0.3.0"
description = "MCP server to collect Cortex AES (Koi) Proof of Value evidence over the Koi API, multi-tenant"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Julien Billochon"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
# future rendering chain (PPTX/DOCX always, PDF needs system GTK on Windows)
render = ["python-pptx>=1.0.2", "python-docx>=1.1.0"]
pdf = ["weasyprint>=62.0"]

[project.scripts]
koi-pov-mcp = "koi_pov_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
