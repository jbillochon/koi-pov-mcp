[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koi-pov-mcp"
version = "0.7.3"
description = "MCP server for Cortex AES (Koi) PoV operations: multi-tenant collection, TI enrichment (OSV/KEV/EPSS/NVD/MITRE), XSIAM cross-referencing, follow-up diffs, DOCX/PPTX/PDF deliverables"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Julien Billochon"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
# PDF needs system GTK on Windows, hence optional
pdf = ["weasyprint>=62.0"]

[project.scripts]
koi-pov-mcp = "koi_pov_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
